[graph]
# Match CI (`cargo-deny-action` checks optional features such as `python`).
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-DFS-2016",
    # bzip2/libbz2 license (used by libbz2-rs-sys via bzip2 crate).
    "bzip2-1.0.6",
    # webpki-root-certs is just the Mozilla CA bundle; CDLA-Permissive-2.0
    # is a community-data license that behaves like MIT for us.
    "CDLA-Permissive-2.0",
    # target-lexicon (pyo3-build-config) ships Apache-2.0 with the LLVM
    # exception. Same grant as Apache-2.0 plus an explicit patent/waiver clause.
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
